<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой кошелёк</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="login-screen" class="login-box">
        <h1>Мой кошелёк</h1>
        <form id="login-form">
            <label for="password-input">Пароль</label>
            <input type="password" id="password-input" autocomplete="off">
            <button type="submit">Войти</button>
        </form>
        <p id="login-error" class="error"></p>
    </div>

    <div id="main-screen" hidden>
        <header class="top">
            <h1>Мой кошелёк</h1>
            <button id="logout-btn" type="button">Выйти</button>
        </header>
        <section class="card balance">
            <p class="balance-label">Текущий баланс</p>
            <p id="balance" class="balance-value">0 ₽</p>
            <p class="balance-sub">Доходы: <span id="total-income">0 ₽</span></p>
            <p class="balance-sub">Расходы: <span id="total-expense">0 ₽</span></p>
        </section>
        
        <div class="columns">
            <div class="column">
                <section class="card">
                                    <section class="card">
                    <h2>Новая операция</h2>
                    <form id="operation-form">
                        <label for="op-type">Тип</label>
                        <select id="op-type">
                            <option value="expense">Расход</option>
                            <option value="income">Доход</option>
                        </select>

                        <label for="op-amount">Сумма, ₽</label>
                        <input type="text" id="op-amount" inputmode="numeric" maxlength="9" autocomplete="off">

                        <div id="op-category-box">
                            <label for="op-category">Категория</label>
                            <select id="op-category"></select>
                        </div>

                        <label for="op-date">Дата</label>
                        <input type="date" id="op-date">

                        <button type="submit">Добавить</button>
                    </form>
                    <p id="op-error" class="error"></p>
                </section>
                    <h2>Категории расходов</h2>
                    <form id="category-form">
                        <label for="category-input">Название новой категории</label>
                        <input type="text" id="category-input" autocomplete="off">
                        <button type="submit">Добавить категорию</button>
                    </form>
                    <p id="category-error" class="error"></p>
                    <ul id="category-list"></ul>
                </section>
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>

</html>
